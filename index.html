<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mutfak Defterim</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F4F0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mutfak">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --bg:#F4F0E9; --bg2:#EAE4D9; --surface:#FFFFFF; --ink:#1E1C19; --ink2:#4A453E; --muted:#8C857A;
  --line:rgba(30,28,25,.08); --line2:rgba(30,28,25,.2);
  --accent:#B4603A; --accent-soft:rgba(180,96,58,.13);
  --glass:rgba(255,255,255,.74);
  --shadow:0 20px 44px -16px rgba(50,35,20,.32),0 2px 8px rgba(50,35,20,.07);
  --ease:cubic-bezier(.22,1,.36,1); --soft:cubic-bezier(.4,0,.2,1);
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --kb:0px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121110; --bg2:#1B1917; --surface:#1D1B18; --ink:#F3EFE8; --ink2:#CBC4B9; --muted:#8B8478;
    --line:rgba(243,239,232,.09); --line2:rgba(243,239,232,.24);
    --accent:#DB8A60; --accent-soft:rgba(219,138,96,.17);
    --glass:rgba(36,34,31,.72);
    --shadow:0 20px 44px -14px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none;animation:boot .9s var(--soft) both}
@keyframes boot{from{opacity:0}to{opacity:1}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;width:100%;-webkit-appearance:none;appearance:none;border-radius:0;
  -webkit-user-select:text;user-select:text;font-size:16px}
textarea{resize:none}
ul{list-style:none;margin:0;padding:0}
[hidden]{display:none!important}
.ic{width:24px;height:24px;display:block;overflow:visible}

/* pages */
.page{display:none;padding:calc(var(--sat) + 26px) 20px 150px;max-width:640px;margin:0 auto}
.page.active{display:block;animation:pageIn .75s var(--ease) both}
.page.out{display:block;animation:pageOut .18s var(--soft) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pageOut{to{opacity:0;transform:translateY(-5px)}}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1.title{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:-.03em;line-height:1.02;margin:9px 0 0}
.brand{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--accent)}
.brand .ic{width:26px;height:26px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 14px}
.sec-title h2{margin:0;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.015em}
.sec-title span{font-size:13px;color:var(--muted)}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px}
.card{cursor:pointer;opacity:0;animation:cardIn .9s var(--ease) both;animation-delay:calc(var(--i)*70ms + 90ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.media{position:relative;border-radius:24px;overflow:hidden;background:var(--bg2);transition:transform .7s var(--ease);box-shadow:0 10px 28px -16px rgba(50,35,20,.35)}
.card:active .media{transform:scale(.965);transition-duration:.2s}
.card.tall .media{aspect-ratio:4/5}
.card.sq .media{aspect-ratio:1}
.card.hero .media{aspect-ratio:16/12}
.media>img,.media>.phv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.phv svg{width:100%;height:100%;display:block}
img.fade{opacity:0;transform:scale(1.05);transition:opacity .9s var(--soft),transform 1.4s var(--ease)}
img.fade.in{opacity:1;transform:none}
.meta{padding:11px 4px 0}
.meta h3{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.22;margin:0;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:6px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;min-height:15px}
.meta p .ic{width:14px;height:14px}
.hshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,10,6,.78),rgba(14,10,6,.0) 62%)}
.hmeta{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.hmeta .tag{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;margin-bottom:8px}
.hmeta h3{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.1;margin:0;letter-spacing:-.02em}
.hmeta p{margin:8px 0 0;font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.hmeta p .ic{width:15px;height:15px}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  color:var(--ink);transition:transform .5s var(--ease),color .4s var(--soft);z-index:2}
.fav .ic{width:19px;height:19px}
.fav:active{transform:scale(.88)}
.tint{opacity:0;transition:opacity .5s var(--soft)}
.fav.on{color:var(--accent)}
.fav.on .tint{opacity:.92}
.fav.pop{animation:pop .65s var(--ease)}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.3)}100%{transform:scale(1)}}
.fresh .media{animation:fresh 1.8s var(--soft) .3s both}
@keyframes fresh{0%,100%{box-shadow:0 0 0 0 rgba(180,96,58,0)}35%{box-shadow:0 0 0 5px var(--accent-soft)}}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 12px 0;animation:pageIn .9s var(--ease) .1s both}
.empty svg{width:min(78vw,300px);height:auto;color:var(--ink)}
.empty h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.02em;margin:18px 0 8px}
.empty p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.55;max-width:290px}
.steam{animation:steam 3.6s var(--soft) infinite;transform-origin:center}
.steam.s2{animation-delay:.9s}.steam.s3{animation-delay:1.8s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}

/* nav island */
#nav{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 14px);display:flex;justify-content:center;z-index:30;pointer-events:none;
  transition:transform .8s var(--ease),opacity .5s var(--soft)}
#nav.compact{transform:translateY(8px) scale(.93)}
.island{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:space-between;
  width:min(calc(100vw - 36px),348px);height:68px;padding:0 11px;border-radius:34px;
  background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:var(--shadow),inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.35);animation:islandIn 1s var(--ease) .25s both}
@keyframes islandIn{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
.pill{position:absolute;left:0;top:11px;width:46px;height:46px;border-radius:23px;background:var(--accent-soft);
  transition:transform .75s var(--ease);will-change:transform}
.tab{position:relative;z-index:1;width:46px;height:46px;border-radius:23px;display:grid;place-items:center;color:var(--muted);
  transition:color .5s var(--soft),transform .5s var(--ease)}
.tab .ic{transition:transform .6s var(--ease)}
.tab.active{color:var(--ink)}
.tab.active .ic{transform:translateY(-1px) scale(1.04)}
.tab:active{transform:scale(.86);transition-duration:.15s}
.tab.active .tint{opacity:.15}
.slot{width:60px;flex:none}
.fab{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;
  box-shadow:0 12px 24px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .6s var(--ease)}
.fab .ic{width:26px;height:26px;transition:transform .8s var(--ease)}
.fab:active{transform:scale(.9);transition-duration:.15s}
.fab:active .ic{transform:rotate(90deg)}
.fab.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;animation:ring 2.9s var(--soft) infinite}
@keyframes ring{0%{transform:scale(.88);opacity:.6}100%{transform:scale(1.55);opacity:0}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);visibility:hidden;opacity:0;transform:translateY(30px) scale(.985);
  transition:opacity .5s var(--soft),transform .75s var(--ease),visibility 0s .75s}
.overlay.open{visibility:visible;opacity:1;transform:none;transition:opacity .5s var(--soft),transform .75s var(--ease),visibility 0s}
.btn-primary{pointer-events:auto;height:56px;padding:0 28px;border-radius:28px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;
  box-shadow:0 16px 30px -12px rgba(0,0,0,.5);transition:transform .5s var(--ease),opacity .5s var(--soft),box-shadow .5s}
.btn-primary:active{transform:scale(.97);transition-duration:.15s}
.btn-primary:disabled{opacity:.3;box-shadow:none}
.btn-primary .ic{width:20px;height:20px}
.gbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .5s var(--ease),color .4s var(--soft)}
.gbtn:active{transform:scale(.88);transition-duration:.15s}
.gbtn .ic{width:21px;height:21px}
.gbtn.on{color:var(--accent)}
.gbtn.on .tint{opacity:.92}

/* detail */
.d-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.d-hero{position:relative;height:min(82vw,470px);overflow:hidden;background:var(--bg2)}
.d-hero>img,.d-hero>.phv{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;will-change:transform;transform-origin:center top}
.d-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 38%)}
.d-sheet{position:relative;margin:-32px auto 0;background:var(--bg);border-radius:32px 32px 0 0;padding:16px 22px 170px;min-height:62vh;max-width:680px}
.d-grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 20px;opacity:.6}
.d-sheet h1{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1.08;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border-radius:17px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink2)}
.chip .ic{width:17px;height:17px;color:var(--accent)}
.d-top{position:absolute;top:0;left:0;right:0;padding:calc(var(--sat) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;z-index:3;
  transition:background .5s var(--soft),box-shadow .5s}
.d-top.solid{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 1px 0 var(--line)}
.d-top .tt{flex:1;min-width:0;font-family:var(--serif);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(7px);transition:opacity .5s var(--soft),transform .7s var(--ease)}
.d-top.solid .tt{opacity:1;transform:none}
.d-top .sp{flex:1}
.dsec{margin-top:34px}
.dsec h2{margin:0 0 6px;display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dsec h2 .ic{width:18px;height:18px;color:var(--accent)}
.dsec h2 em{font-style:normal;margin-left:auto;letter-spacing:0;text-transform:none;font-weight:400;font-size:13px}
.ing{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px;line-height:1.35}
.ing:last-child{border-bottom:0}
.box{flex:none;width:25px;height:25px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center;color:#fff;
  background:transparent;transition:background .5s var(--ease),box-shadow .5s var(--soft),transform .5s var(--ease)}
.box .ic{width:16px;height:16px}
.box path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .6s var(--ease)}
.ing:active .box{transform:scale(.88)}
.ing.done .box{background:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ing.done .box path{stroke-dashoffset:0;transition-delay:.08s}
.ing .tx{transition:color .5s var(--soft);text-decoration:line-through;text-decoration-color:transparent;transition:color .5s var(--soft),text-decoration-color .5s var(--soft)}
.ing.done .tx{color:var(--muted);text-decoration-color:var(--accent)}
.stp{display:grid;grid-template-columns:36px 1fr;gap:15px;position:relative;padding-bottom:26px}
.stp:last-child{padding-bottom:0}
.stp:not(:last-child)::before{content:"";position:absolute;left:17.5px;top:40px;bottom:4px;width:1px;background:var(--line2);opacity:.6}
.num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:17px;background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line2)}
.stp p{margin:6px 0 0;font-size:17px;line-height:1.62;color:var(--ink2)}
.note{margin-top:8px;padding:18px 20px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
.rev{opacity:0;transform:translateY(16px);transition:opacity 1s var(--soft),transform 1.1s var(--ease)}
.rev.in{opacity:1;transform:none}
.d-del{margin:44px auto 0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14.5px;height:44px;padding:0 18px;border-radius:22px;transition:color .4s,transform .5s var(--ease)}
.d-del:active{transform:scale(.95);color:#C0443A}
.d-del .ic{width:18px;height:18px}
.d-cta{position:absolute;left:0;right:0;bottom:0;padding:34px 20px calc(var(--sab) + 18px);background:linear-gradient(to top,var(--bg) 52%,transparent);z-index:3;pointer-events:none;display:flex;justify-content:center}

/* cook mode */
#cook{z-index:70}
.ck-top{position:absolute;top:0;left:0;right:0;padding:calc(var(--sat) + 14px) 16px 0;display:flex;align-items:center;gap:14px;z-index:2}
.ck-prog{flex:1;display:flex;gap:5px}
.ck-prog i{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden;opacity:.55}
.ck-prog i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.ck-prog i.on{opacity:1}.ck-prog i.on::after{transform:none}
.ck-stage{position:absolute;left:0;right:0;top:calc(var(--sat) + 80px);bottom:calc(var(--sab) + 120px);overflow:hidden}
.ck-card{position:absolute;inset:0;overflow-y:auto;padding:16px 28px 10px;display:flex;flex-direction:column;justify-content:center}
.ck-n{font-family:var(--serif);font-size:84px;line-height:1;letter-spacing:-.04em;color:var(--accent);opacity:.9;margin-bottom:12px}
.ck-n small{font-size:22px;color:var(--muted);letter-spacing:0;margin-left:6px}
.ck-card p{margin:0;font-family:var(--serif);font-size:26px;line-height:1.5;letter-spacing:-.01em}
.ck-done{align-items:center;text-align:center}
.ck-done svg{width:96px;height:96px;color:var(--accent);margin-bottom:22px}
.ck-done h2{font-family:var(--serif);font-weight:500;font-size:38px;letter-spacing:-.03em;margin:0 0 10px}
.ck-done p{font-family:var(--sans);font-size:16px;color:var(--muted)}
.ck-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(var(--sab) + 20px);display:flex;gap:12px;justify-content:center;z-index:2}
.round{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2);
  transition:transform .5s var(--ease),opacity .4s var(--soft)}
.round:active{transform:scale(.9);transition-duration:.15s}
.round:disabled{opacity:.3}
.ck-back{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .5s var(--soft),visibility 0s .5s;z-index:3}
.ck-back.on{opacity:1;visibility:visible;transition:opacity .5s var(--soft)}
.ck-sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-radius:30px 30px 0 0;padding:14px 24px calc(var(--sab) + 26px);max-height:72%;overflow-y:auto;
  transform:translateY(105%);transition:transform .8s var(--ease);box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}
.ck-sheet.on{transform:none}
.ck-sheet h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 6px;letter-spacing:-.02em}

/* dialog + toast */
#dialog{position:fixed;inset:0;z-index:95;visibility:hidden;transition:visibility 0s .6s}
#dialog.on{visibility:visible;transition:none}
.dg-back{position:absolute;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .5s var(--soft)}
#dialog.on .dg-back{opacity:1}
.dg-sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 12px);max-width:420px;margin:0 auto;background:var(--bg);border-radius:30px;padding:26px 22px 18px;
  transform:translateY(120%);transition:transform .75s var(--ease);box-shadow:var(--shadow)}
#dialog.on .dg-sheet{transform:none}
.dg-sheet h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
.dg-sheet p{margin:0 0 22px;color:var(--muted);font-size:15.5px;line-height:1.5}
.dg-btns{display:flex;flex-direction:column;gap:10px}
.dg-btns button{height:54px;border-radius:27px;font-weight:600;font-size:16.5px;transition:transform .5s var(--ease)}
.dg-btns button:active{transform:scale(.97);transition-duration:.15s}
.dg-ok{background:var(--ink);color:var(--bg)}
.dg-ok.danger{background:#C0443A;color:#fff}
.dg-no{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2)}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 106px);z-index:99;transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:24px;font-size:14.5px;font-weight:500;white-space:nowrap;max-width:calc(100vw - 40px);
  overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow);transition:opacity .5s var(--soft),transform .8s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* search + settings */
.searchbox{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-radius:28px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
  margin-bottom:6px;transition:box-shadow .5s var(--soft),transform .6s var(--ease)}
.searchbox:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent);transform:scale(1.01)}
.searchbox .ic{width:21px;height:21px;color:var(--muted);flex:none}
.searchbox input{font-size:17px}
.searchbox input::-webkit-search-cancel-button{display:none}
.hint{margin:46px 0 0;text-align:center;color:var(--muted);font-size:15px;line-height:1.6}

.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:14px}

.fsec h4 .ic{width:18px;height:18px;color:var(--accent)}
.row{display:flex;align-items:flex-start;gap:12px;padding:6px 0;animation:rowIn .6s var(--ease) both;transition:opacity .25s var(--soft),transform .3s var(--soft)}
.row.gone{opacity:0;transform:translateX(24px)}

.row .dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.8}
#stepList{counter-reset:s}
#stepList .row{counter-increment:s}
#stepList .dot::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);opacity:1;display:grid;place-items:center;
  font-family:var(--serif);font-size:14px;font-weight:600}
.row input,.row textarea{flex:1;min-width:0;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);font-size:16.5px;line-height:1.45;
  transition:box-shadow .5s var(--soft)}
.row textarea{min-height:50px;overflow:hidden}

.row .rm{flex:none;width:36px;height:50px;display:grid;place-items:center;color:var(--muted);transition:transform .4s var(--ease),color .3s}
.row .rm:active{transform:scale(.85);color:#C0443A}
.row .rm .ic{width:18px;height:18px}
.add-row{display:flex;align-items:center;gap:9px;margin:8px 0 0 40px;height:44px;padding:0 16px 0 12px;border-radius:22px;color:var(--accent);font-weight:600;font-size:15px;
  background:var(--accent-soft);transition:transform .5s var(--ease)}
.add-row:active{transform:scale(.95);transition-duration:.12s}
.add-row .ic{width:18px;height:18px}
.fnote{display:block;background:var(--surface);border-radius:20px;padding:15px 17px;box-shadow:inset 0 0 0 1px var(--line);line-height:1.55;min-height:96px;transition:box-shadow .5s var(--soft)}
.form-bar{position:absolute;left:0;right:0;bottom:var(--kb);padding:30px 20px calc(var(--sab) + 16px);background:linear-gradient(to top,var(--bg) 55%,transparent);display:flex;justify-content:center;z-index:3;pointer-events:none;transition:bottom .3s var(--soft)}
.success{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .5s var(--soft),visibility 0s .5s}
.success.on{opacity:1;visibility:visible;transition:opacity .5s var(--soft)}
.success .in{text-align:center;color:var(--accent)}
.success svg{width:112px;height:112px;overflow:visible}
.ok-ring{stroke-dasharray:227;stroke-dashoffset:227}

/* ---------- storage ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const q=indexedDB.open('mutfak-defteri',1);
    q.onupgradeneeded=()=>{q.result.createObjectStore('recipes',{keyPath:'id'})};
    q.onsuccess=()=>{this.db=q.result;res()};
    q.onerror=()=>rej(q.error);
  })},
  all(){return new Promise((res,rej)=>{const r=this.db.transaction('recipes').objectStore('recipes').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  put(rec){return new Promise((res,rej)=>{const t=this.db.transaction('recipes','readwrite');t.objectStore('recipes').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  del(id){return new Promise((res,rej)=>{const t=this.db.transaction('recipes','readwrite');t.objectStore('recipes').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};

const urlCache=new Map();
function imgURL(r,kind){
  const b=kind==='photo'?r.photo:(r.thumb||r.photo); if(!b)return null;
  const k=r.id+'|'+kind+'|'+r.updated; let u=urlCache.get(k);
  if(!u){u=URL.createObjectURL(b);urlCache.set(k,u)} return u;
}
function dropURLs(id){for(const [k,u] of urlCache){if(k.startsWith(id+'|')){URL.revokeObjectURL(u);urlCache.delete(k)}}}

/* ---------- images ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function processImage(blob){
  const u=URL.createObjectURL(blob);
  try{
    const img=await loadImg(u);
    const mk=(max,q)=>{
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      return new Promise(r=>c.toBlob(r,'image/jpeg',q));
    };
    return {photo:await mk(1600,.86),thumb:await mk(720,.8)};
  }finally{URL.revokeObjectURL(u)}
}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

function gridHTML(list,start){

/* ---------- cook mode ---------- */
const C={r:null,i:0,wl:null,busy:false};
async function wakeOn(){try{if('wakeLock' in navigator)C.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function wakeOff(){try{C.wl&&C.wl.release();C.wl=null}catch(e){}}
function openCook(r){
  if(!r||!r.steps.length)return;
  C.r=r;C.i=0;C.busy=false;
  const el=$('#cook');
  el.innerHTML='<div class="ck-top"><button class="gbtn" id="ckClose" aria-label="Kapat">'+ic('close')+'</button><div class="ck-prog">'+r.steps.map(()=>'<i></i>').join('')+
    '</div><button class="gbtn" id="ckIng" aria-label="Malzemeler">'+ic('leaf')+'</button></div>'+
    '<div class="ck-stage" id="ckStage"></div>'+
    '<div class="ck-bottom"><button class="round" id="ckPrev" aria-label="Önceki adım">'+ic('back')+'</button><button class="btn-primary" id="ckNext"></button></div>'+
    '<div class="ck-back" id="ckBack"></div>'+
    '<div class="ck-sheet" id="ckSheet"><div class="d-grab"></div><h3>Malzemeler</h3><ul>'+
    (r.ingredients.length?r.ingredients.map(x=>'<li class="ing"><span class="box">'+ic('check',{w:2.2})+'</span><span class="tx">'+esc(x)+'</span></li>').join(''):'<li class="hint" style="margin:20px 0">Bu tarife malzeme eklenmemiş.</li>')+
    '</ul></div>';
  $$('#cook .ing').forEach(li=>li.addEventListener('click',()=>li.classList.toggle('done')));
  $('#ckClose').onclick=closeCook;
  $('#ckNext').onclick=()=>cookGo(1);
  $('#ckPrev').onclick=()=>cookGo(-1);
  const sheet=$('#ckSheet'),back=$('#ckBack');
  const sh=on=>{sheet.classList.toggle('on',on);back.classList.toggle('on',on)};
  $('#ckIng').onclick=()=>sh(!sheet.classList.contains('on'));
  back.onclick=()=>sh(false);
  const st=$('#ckStage');let x0=null;
  st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  st.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>56)cookGo(dx<0?1:-1)},{passive:true});
  cookRender(0,true);openOv(el);wakeOn();
}
function cookRender(dir,first){
  const r=C.r,st=$('#ckStage'),n=r.steps.length;
  const done=C.i>=n;
  const card=document.createElement('div');
  if(done){
    card.className='ck-card ck-done';
    card.innerHTML='<svg viewBox="0 0 112 112" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle class="ok-ring" cx="56" cy="56" r="36" transform="rotate(-90 56 56)" style="stroke-dasharray:227;stroke-dashoffset:227;animation:draw 1s var(--ease) .1s forwards"/><path d="M40 57l11 11 21-23" style="stroke-dasharray:44;stroke-dashoffset:44;animation:draw .75s var(--ease) .65s forwards"/></svg><h2>Afiyet olsun</h2><p>'+esc(r.title)+'</p>';
  }else{
    card.className='ck-card';
    card.innerHTML='<div class="ck-n">'+(C.i+1)+'<small>/ '+n+'</small></div><p>'+esc(r.steps[C.i])+'</p>';
  }
  const old=st.firstElementChild;
  st.appendChild(card);
  if(!first){
    card.animate([{opacity:0,transform:'translateX('+(48*dir)+'px)'},{opacity:1,transform:'none'}],{duration:650,easing:'cubic-bezier(.22,1,.36,1)'});
    if(old){const a=old.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-48*dir)+'px)'}],{duration:320,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});a.onfinish=()=>old.remove()}
  }else if(old)old.remove();
  $$('.ck-prog i').forEach((b,i)=>b.classList.toggle('on',i<=C.i||done));
  $('#ckPrev').disabled=C.i===0;
  $('#ckNext').innerHTML=done?'Tarife dön':(C.i===n-1?'Bitir':'Sonraki adım'+ic('forward'));
}
function cookGo(d){
  if(C.busy)return;
  const n=C.r.steps.length;
  if(C.i>=n&&d>0){closeCook();return}
  const ni=C.i+d;if(ni<0||ni>n)return;
  C.busy=true;C.i=ni;cookRender(d);setTimeout(()=>C.busy=false,380);
}
function closeCook(){closeOv($('#cook'));wakeOff()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('#cook').classList.contains('open'))wakeOn()});

/* ---------- add / edit flow ---------- */
const F={id:null,photo:null,thumb:null,prev:null,minutes:30,servings:4,facing:'environment',stream:null,editing:false,busy:false,initial:''};
let formBuilt=false;
function buildForm(){
  if(formBuilt)return;formBuilt=true;
  $('#camClose').innerHTML=ic('close');$('#camFlip').innerHTML=ic('flip');$('#camGallery').innerHTML=ic('image');
  $('#formBack').innerHTML=ic('back');$('#formClose').innerHTML=ic('close');
  $('#hIng').innerHTML=ic('leaf')+'Malzemeler';$('#hStep').innerHTML=ic('list')+'Hazırlanışı';$('#hNote').innerHTML=ic('edit')+'Notlarım';
  $('#addIng').innerHTML=ic('plus')+'Malzeme ekle';$('#addStep').innerHTML=ic('plus')+'Adım ekle';
  $('#camMsgIc').innerHTML=ic('camera');
  $('#stMin').innerHTML='<div class="sl">'+ic('clock')+'Süre</div><div class="sv"><output id="vMin"></output><div class="sb"><button data-d="-5" aria-label="Azalt">'+ic('minus')+'</button><button data-d="5" aria-label="Artır">'+ic('plus')+'</button></div></div>';
  $('#stSrv').innerHTML='<div class="sl">'+ic('bowl')+'Porsiyon</div><div class="sv"><output id="vSrv"></output><div class="sb"><button data-d="-1" aria-label="Azalt">'+ic('minus')+'</button><button data-d="1" aria-label="Artır">'+ic('plus')+'</button></div></div>';
  $$('#stMin button').forEach(b=>b.onclick=()=>{F.minutes=Math.max(0,Math.min(600,F.minutes+(+b.dataset.d)));showSteppers('vMin')});
  $$('#stSrv button').forEach(b=>b.onclick=()=>{F.servings=Math.max(1,Math.min(50,F.servings+(+b.dataset.d)));showSteppers('vSrv')});
  $('#fTitle').addEventListener('input',()=>{$('#saveBtn').disabled=!$('#fTitle').value.trim()});
  $('#fTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});
  $('#addIng').onclick=()=>ingRow('',true);
  $('#addStep').onclick=()=>stepRow('',true);
  $('#saveBtn').onclick=save;
  $('#camClose').onclick=()=>closeAdd();
  $('#formClose').onclick=()=>tryClose();
  $('#formBack').onclick=()=>{if(F.editing)tryClose();else retake()};
  $('#retake').onclick=()=>{if(F.editing||!$('#add').classList.contains('formOn')||true){F.editing?$('#filePick').click():retake()}};
  $('#camFlip').onclick=()=>{const b=$('#camFlip');b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');F.facing=F.facing==='environment'?'user':'environment';startCam()};
  $('#camGallery').onclick=()=>$('#filePick').click();
  $('#camSkip').onclick=()=>{F.photo=null;F.thumb=null;if(F.prev){URL.revokeObjectURL(F.prev);F.prev=null}syncPhoto();goForm()};
  $('#shutter').onclick=shutter;
  $('#camMsgBtn').onclick=()=>$('#fileCam').click();
  const onFile=async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    try{await setPhoto(f);if(!$('#add').classList.contains('formOn'))goForm()}catch(err){toast('Fotoğraf okunamadı')}
  };
  $('#filePick').addEventListener('change',onFile);$('#fileCam').addEventListener('change',onFile);
  $('#fileImport').addEventListener('change',importAll);
  if(window.visualViewport){
    const vv=window.visualViewport;
    const f=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);root.style.setProperty('--kb',kb+'px')};
    vv.addEventListener('resize',f);vv.addEventListener('scroll',f);
  }
}
function showSteppers(which){
  const set=(id,v)=>{const o=$('#'+id);if(!o)return;const t=id==='vMin'?(F.minutes?F.minutes+' dk':'Yok'):(F.servings+' kişi');
    if(o.textContent!==t){o.textContent=t;if(which===id){o.classList.remove('bump');void o.offsetWidth;o.classList.add('bump')}}};
  set('vMin');set('vSrv');
}
function autoGrow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function rowRemove(row,list,focusPrev){
  const prev=row.previousElementSibling;
  row.classList.add('gone');setTimeout(()=>{row.remove();if(focusPrev&&prev){const i=$('input,textarea',prev);i&&i.focus()}},260);
}
function ingRow(v,focus,after){
  const row=document.createElement('div');row.className='row';
  row.innerHTML='<span class="dot"></span><input type="text" enterkeyhint="next" placeholder="Örn. 2 su bardağı un" autocomplete="off" autocapitalize="sentences" value="'+esc(v)+'"><button class="rm" aria-label="Sil">'+ic('close')+'</button>';
  const list=$('#ingList');
  if(after&&after.nextSibling)list.insertBefore(row,after.nextSibling);else list.appendChild(row);
  const inp=$('input',row);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();ingRow('',true,row)}
    else if(e.key==='Backspace'&&!inp.value&&list.children.length>1){e.preventDefault();rowRemove(row,list,true)}
  });
  inp.addEventListener('focus',()=>setTimeout(()=>inp.scrollIntoView({block:'center',behavior:'smooth'}),320));
  $('.rm',row).onclick=()=>{if(list.children.length>1)rowRemove(row,list,false);else{inp.value=''}};
  if(focus)setTimeout(()=>inp.focus(),60);
}
function stepRow(v,focus,after){
  const row=document.createElement('div');row.className='row';
  row.innerHTML='<span class="dot"></span><textarea rows="1" enterkeyhint="next" placeholder="Örn. Soğanları ince doğrayıp yağda pembeleşinceye kadar kavurun." autocapitalize="sentences">'+esc(v)+'</textarea><button class="rm" aria-label="Sil">'+ic('close')+'</button>';
  const list=$('#stepList');
  if(after&&after.nextSibling)list.insertBefore(row,after.nextSibling);else list.appendChild(row);
  const ta=$('textarea',row);
  ta.addEventListener('input',()=>autoGrow(ta));
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();stepRow('',true,row)}
    else if(e.key==='Backspace'&&!ta.value&&list.children.length>1){e.preventDefault();rowRemove(row,list,true)}
  });
  ta.addEventListener('focus',()=>setTimeout(()=>ta.scrollIntoView({block:'center',behavior:'smooth'}),320));
  $('.rm',row).onclick=()=>{if(list.children.length>1)rowRemove(row,list,false);else{ta.value='';autoGrow(ta)}};
  requestAnimationFrame(()=>autoGrow(ta));
  if(focus)setTimeout(()=>ta.focus(),60);
}
function syncPhoto(){
  const img=$('#photoImg'),ph=$('#photoPh');
  if(F.prev){img.src=F.prev;img.hidden=false;ph.hidden=true}
  else{img.hidden=true;img.removeAttribute('src');ph.hidden=false;ph.innerHTML=phSVG(F.id||'yeni')}
  $('#retake').innerHTML=ic('camera')+(F.editing?(F.prev?'Fotoğrafı değiştir':'Fotoğraf ekle'):(F.prev?'Yeniden çek':'Fotoğraf ekle'));
}
async function setPhoto(blob){
  const p=await processImage(blob);
  if(F.prev)URL.revokeObjectURL(F.prev);
  F.photo=p.photo;F.thumb=p.thumb;F.prev=URL.createObjectURL(p.thumb);syncPhoto();
}
function openAdd(r){
  buildForm();
  const add=$('#add');
  F.editing=!!r;F.id=r?r.id:null;F.busy=false;
  F.photo=r?r.photo:null;F.thumb=r?r.thumb:null;
  if(F.prev){URL.revokeObjectURL(F.prev);F.prev=null}
  if(r&&(r.thumb||r.photo))F.prev=URL.createObjectURL(r.thumb||r.photo);
  F.minutes=r?r.minutes:30;F.servings=r?r.servings:4;
  $('#fTitle').value=r?r.title:'';
  $('#fNote').value=r?r.note:'';
  $('#ingList').innerHTML='';$('#stepList').innerHTML='';
  const ings=r&&r.ingredients.length?r.ingredients:[''];const stps=r&&r.steps.length?r.steps:[''];
  ings.forEach(x=>ingRow(x));stps.forEach(x=>stepRow(x));
  showSteppers();syncPhoto();
  $('#saveBtn').disabled=!$('#fTitle').value.trim();
  $('#saveBtn').textContent=r?'Değişiklikleri kaydet':'Kaydet';
  $('#formTitle').textContent=r?'Tarifi düzenle':'Yemek detayları';
  $('#formClose').style.visibility=r?'hidden':'visible';
  $('#formScroll').scrollTop=0;
  F.initial=snapshot();
  $('#success').classList.remove('on');
  if(r){add.classList.add('formOn');openOv(add)}
  else{add.classList.remove('formOn');openOv(add);startCam()}
}
function snapshot(){
  return JSON.stringify([$('#fTitle').value,$$('#ingList input').map(i=>i.value),$$('#stepList textarea').map(i=>i.value),$('#fNote').value,F.minutes,F.servings,!!F.photo]);
}
async function tryClose(){
  if(snapshot()!==F.initial){
    const ok=await confirmDlg({title:'Vazgeçilsin mi?',text:'Yaptığın değişiklikler kaydedilmeyecek.',ok:'Vazgeç ve kapat',cancel:'Devam et',danger:true});
    if(!ok)return;
  }
  closeAdd();
}
function closeAdd(){
  const add=$('#add');closeOv(add);stopCam();
  setTimeout(()=>{if(!add.classList.contains('open'))add.classList.remove('formOn')},800);
}
async function startCam(){
  stopCam();
  const vid=$('#vid');vid.classList.remove('live');$('#camMsg').hidden=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFallback('Bu cihazda canlı kamera açılamadı. Cihazın kamerasıyla fotoğraf çekebilirsin.');return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:F.facing},width:{ideal:1920},height:{ideal:1920}},audio:false});
    if(!$('#add').classList.contains('open')||$('#add').classList.contains('formOn')){s.getTracks().forEach(t=>t.stop());return}
    F.stream=s;vid.srcObject=s;
    try{await vid.play()}catch(e){}
    vid.classList.add('live');
  }catch(e){
    camFallback(e&&e.name==='NotAllowedError'?'Kamera izni verilmedi. İstersen cihazın kamerasıyla fotoğraf çekebilirsin.':'Kamera açılamadı. Cihazın kamerasıyla fotoğraf çekebilirsin.');
  }
}
function camFallback(msg){$('#camMsgTx').textContent=msg;$('#camMsg').hidden=false}
function stopCam(){
  if(F.stream){F.stream.getTracks().forEach(t=>t.stop());F.stream=null}
  const v=$('#vid');if(v){v.srcObject=null;v.classList.remove('live')}
}
async function shutter(){
  const v=$('#vid');
  if(!F.stream||!v.videoWidth){$('#fileCam').click();return}
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  $('#flash').animate([{opacity:.9},{opacity:0}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  try{await setPhoto(blob);goForm()}catch(e){toast('Fotoğraf kaydedilemedi')}
}
function goForm(){
  const add=$('#add');add.classList.add('formOn');
  setTimeout(()=>{if(add.classList.contains('formOn'))stopCam()},1000);
}
function retake(){
  $('#add').classList.remove('formOn');startCam();
}
async function save(){
  if(F.busy)return;
  const title=$('#fTitle').value.trim();
  if(!title){const w=$('#titleWrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');$('#fTitle').focus();return}
  F.busy=true;$('#saveBtn').disabled=true;
  document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  const now=Date.now(),old=F.editing?byId(F.id):null;
  const rec={
    id:F.id||uid(),title,minutes:F.minutes,servings:F.servings,
    ingredients:$$('#ingList input').map(i=>i.value.trim()).filter(Boolean),
    steps:$$('#stepList textarea').map(i=>i.value.trim()).filter(Boolean),
    note:$('#fNote').value.trim(),fav:old?old.fav:false,created:old?old.created:now,updated:now,
    photo:F.photo||null,thumb:F.thumb||null
  };
  try{
    await DB.put(rec);
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){F.busy=false;$('#saveBtn').disabled=false;toast('Kaydedilemedi, depolama dolu olabilir');return}
  dropURLs(rec.id);
  const i=recipes.findIndex(x=>x.id===rec.id);if(i>=0)recipes[i]=rec;else recipes.push(rec);
  sortR();
  $('#successTx').textContent=old?'Değişiklikler kaydedildi':'Tarif kaydedildi';
  $('#success').classList.add('on');
  await wait(1900);
  const wasEdit=!!old;
  closeAdd();
  if(!wasEdit)freshId=rec.id;
  if(wasEdit&&cur===rec.id){openDetail(rec.id)}
  if(tab!=='home'&&!wasEdit){tab='home';$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='home'));updatePill();$$('.page').forEach(p=>p.classList.remove('active'));$('#page-home').classList.add('active')}
  renderAll();
  window.scrollTo(0,0);
  F.busy=false;
}

/* ---------- backup ---------- */
async function exportAll(){
  if(!recipes.length){toast('Yedeklenecek tarif yok');return}
  const items=[];
  for(const r of recipes){items.push({id:r.id,title:r.title,minutes:r.minutes,servings:r.servings,ingredients:r.ingredients,steps:r.steps,note:r.note,fav:r.fav,created:r.created,updated:r.updated,photo:r.photo?await b2d(r.photo):null})}
  const blob=new Blob([JSON.stringify({app:'mutfak-defteri',v:1,items})],{type:'application/json'});
  const file=new File([blob],'mutfak-defteri-yedek.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Mutfak Defterim yedeği'});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mutfak-defteri-yedek.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
async function importAll(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data||data.app!=='mutfak-defteri'||!Array.isArray(data.items))throw new Error('bad');
    let n=0;
    for(const it of data.items){
      let photo=null,thumb=null;
      if(it.photo){const b=await (await fetch(it.photo)).blob();const p=await processImage(b);photo=p.photo;thumb=p.thumb}
      const rec={id:it.id||uid(),title:String(it.title||'Adsız tarif'),minutes:+it.minutes||0,servings:+it.servings||4,
        ingredients:Array.isArray(it.ingredients)?it.ingredients.map(String):[],steps:Array.isArray(it.steps)?it.steps.map(String):[],
        note:String(it.note||''),fav:!!it.fav,created:+it.created||Date.now(),updated:Date.now(),photo,thumb};
      await DB.put(rec);dropURLs(rec.id);
      const i=recipes.findIndex(x=>x.id===rec.id);if(i>=0)recipes[i]=rec;else recipes.push(rec);n++;
    }
    sortR();renderAll();renderSettings();toast(n+' tarif geri yüklendi');
  }catch(err){toast('Yedek dosyası okunamadı')}
}

/* ---------- init ---------- */
function bindUI(){
  $('#brand').innerHTML=ic('cloche');
  $$('.tab').forEach(b=>{b.innerHTML=ic({home:'home',search:'search',favs:'heart',settings:'sliders'}[b.dataset.tab]);b.onclick=()=>setTab(b.dataset.tab)});
  $('#fab').innerHTML=ic('plus',{w:1.9});
  $('#fab').onclick=()=>openAdd(null);
  document.addEventListener('click',e=>{
    const fav=e.target.closest('[data-fav]');
    if(fav){e.stopPropagation();toggleFav(fav.dataset.fav);return}
    const card=e.target.closest('[data-open]');
    if(card)openDetail(card.dataset.open);
  });
  updatePill();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(updatePill);
}
(async function init(){
  bindUI();
  try{await DB.open();recipes=await DB.all();sortR()}catch(e){toast('Depolama açılamadı')}
  renderAll();updatePill();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
})();
</script>
